name: Train Model

on:
  push:
    branches: [main]
    paths:
      - "fraud-detect/src/**"
      - "fraud-detect/data/**"
  workflow_dispatch:
    inputs:
      data_path:
        description: "S3 path to training data"
        required: false
        default: "s3://fraud-detect-artifacts/raw/creditcard.csv"

jobs:
  train:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fraud-detect

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Train model on Databricks
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          MODEL_NAME: fraud-detection-model
        run: python -m src.training.train

      - name: Evaluate and promote model
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          MODEL_NAME: fraud-detection-model
        run: python -m src.evaluation.evaluate
