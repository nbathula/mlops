name: Deploy to Databricks Serving

on:
  workflow_run:
    workflows: ["Train Model"]
    types: [completed]
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fraud-detect

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install databricks-sdk mlflow

      - name: Get latest registered model version
        id: model_version
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          VERSION=$(python3 -c "
          import mlflow, os
          mlflow.set_tracking_uri('databricks')
          client = mlflow.tracking.MlflowClient()
          versions = client.search_model_versions(\"name='workspace.default.fraud-detection-model'\")
          latest = sorted(versions, key=lambda v: int(v.version))[-1]
          print(latest.version)
          ")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Deploying model version $VERSION"

      - name: Update Databricks Model Serving endpoint
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          MODEL_NAME: workspace.default.fraud-detection-model
          MODEL_VERSION: ${{ steps.model_version.outputs.version }}
        run: python scripts/deploy_serving.py
