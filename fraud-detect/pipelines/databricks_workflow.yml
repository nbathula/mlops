resources:
  jobs:
    fraud_detect_training_pipeline:
      name: fraud-detect-training-pipeline
      schedule:
        quartz_cron_expression: "0 0 2 * * ?"
        timezone_id: UTC
        pause_status: UNPAUSED

      environments:
        - environment_key: ml_env
          spec:
            client: "1"
            dependencies:
              - boto3
              - loguru
              - xgboost
              - imbalanced-learn
              - scikit-learn
              - scipy

      tasks:
        - task_key: ingest_data
          notebook_task:
            notebook_path: ${workspace.file_path}/notebooks/01_ingest
            base_parameters:
              s3_bucket: ${var.s3_bucket}
          environment_key: ml_env

        - task_key: build_features
          depends_on:
            - task_key: ingest_data
          notebook_task:
            notebook_path: ${workspace.file_path}/notebooks/02_features
          environment_key: ml_env

        - task_key: train_model
          depends_on:
            - task_key: build_features
          notebook_task:
            notebook_path: ${workspace.file_path}/notebooks/03_train
            base_parameters:
              mlflow_experiment: ${var.mlflow_experiment}
              model_name: ${var.model_name}
          environment_key: ml_env

        - task_key: evaluate_and_promote
          depends_on:
            - task_key: train_model
          notebook_task:
            notebook_path: ${workspace.file_path}/notebooks/04_evaluate
            base_parameters:
              model_name: ${var.model_name}
          environment_key: ml_env

        - task_key: drift_check
          depends_on:
            - task_key: evaluate_and_promote
          notebook_task:
            notebook_path: ${workspace.file_path}/notebooks/05_drift
            base_parameters:
              s3_bucket: ${var.s3_bucket}
          environment_key: ml_env
